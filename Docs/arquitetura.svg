<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Arquitetura do sistema Stock Analysis</title>
  <desc id="description">Fluxo entre usuario, frontend em Nginx, backend Flask, banco SQLite e Alpha Vantage.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef6f3"/>
    </linearGradient>
    <linearGradient id="frontend" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f1ff"/>
      <stop offset="100%" stop-color="#d5e7ff"/>
    </linearGradient>
    <linearGradient id="backend" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7f8f1"/>
      <stop offset="100%" stop-color="#cfeee1"/>
    </linearGradient>
    <linearGradient id="external" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3d8"/>
      <stop offset="100%" stop-color="#ffe2a9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#18364a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5f7b"/>
    </marker>
    <style>
      .title { font: 700 38px 'Segoe UI', sans-serif; fill: #123247; }
      .subtitle { font: 400 18px 'Segoe UI', sans-serif; fill: #55717f; }
      .container-label { font: 700 15px 'Segoe UI', sans-serif; fill: #2f5f7b; letter-spacing: 1.3px; }
      .card-title { font: 700 27px 'Segoe UI', sans-serif; fill: #173545; }
      .card-text { font: 400 17px 'Segoe UI', sans-serif; fill: #46616f; }
      .connection { font: 700 16px 'Segoe UI', sans-serif; fill: #2f5f7b; }
      .small { font: 400 14px 'Segoe UI', sans-serif; fill: #607985; }
      .legend-title { font: 700 18px 'Segoe UI', sans-serif; fill: #173545; }
      .legend-text { font: 400 15px 'Segoe UI', sans-serif; fill: #46616f; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <path d="M 0 185 C 300 125, 520 255, 810 185 S 1320 125, 1600 180" fill="none" stroke="#d9e8ee" stroke-width="2"/>
  <text x="800" y="76" text-anchor="middle" class="title">Arquitetura do Sistema Stock Analysis</text>
  <text x="800" y="109" text-anchor="middle" class="subtitle">Cenario 1.1 | Front-End, API, persistencia SQLite e API externa</text>

  <g filter="url(#shadow)">
    <rect x="80" y="308" width="150" height="166" rx="24" fill="#ffffff" stroke="#88a9ba" stroke-width="2"/>
    <rect x="105" y="337" width="100" height="62" rx="10" fill="#dbeaf0" stroke="#2f5f7b" stroke-width="3"/>
    <path d="M 126 417 H 184" stroke="#2f5f7b" stroke-width="6" stroke-linecap="round"/>
    <path d="M 142 433 H 168" stroke="#2f5f7b" stroke-width="6" stroke-linecap="round"/>
    <text x="155" y="452" text-anchor="middle" class="card-text">Usuario</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="290" y="245" width="330" height="292" rx="25" fill="#ffffff" stroke="#5f94b8" stroke-width="3"/>
    <rect x="290" y="245" width="330" height="48" rx="25" fill="#dbeeff"/>
    <path d="M 290 293 H 620" stroke="#5f94b8" stroke-width="3"/>
    <text x="455" y="276" text-anchor="middle" class="container-label">CONTAINER DOCKER</text>
    <rect x="326" y="327" width="258" height="164" rx="17" fill="url(#frontend)" stroke="#4f86b0" stroke-width="2"/>
    <text x="455" y="382" text-anchor="middle" class="card-title">Front-End</text>
    <text x="455" y="416" text-anchor="middle" class="card-text">HTML | CSS | JavaScript</text>
    <rect x="375" y="441" width="160" height="31" rx="15" fill="#ffffff" stroke="#7aa8c8"/>
    <text x="455" y="463" text-anchor="middle" class="small">Nginx - porta 80</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="770" y="245" width="330" height="292" rx="25" fill="#ffffff" stroke="#4f9a7b" stroke-width="3"/>
    <rect x="770" y="245" width="330" height="48" rx="25" fill="#dbf4e9"/>
    <path d="M 770 293 H 1100" stroke="#4f9a7b" stroke-width="3"/>
    <text x="935" y="276" text-anchor="middle" class="container-label">CONTAINER DOCKER</text>
    <rect x="806" y="327" width="258" height="164" rx="17" fill="url(#backend)" stroke="#469675" stroke-width="2"/>
    <text x="935" y="382" text-anchor="middle" class="card-title">Back-End</text>
    <text x="935" y="416" text-anchor="middle" class="card-text">Python | Flask | SQLAlchemy</text>
    <rect x="855" y="441" width="160" height="31" rx="15" fill="#ffffff" stroke="#77b99d"/>
    <text x="935" y="463" text-anchor="middle" class="small">API REST - porta 5000</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1240" y="308" width="230" height="166" rx="24" fill="#ffffff" stroke="#8997a7" stroke-width="2"/>
    <path d="M 1293 350 V 410 C 1293 439, 1417 439, 1417 410 V 350" fill="#dce5ed" stroke="#58768a" stroke-width="3"/>
    <ellipse cx="1355" cy="350" rx="62" ry="22" fill="#dce5ed" stroke="#58768a" stroke-width="3"/>
    <path d="M 1293 374 C 1293 403, 1417 403, 1417 374" fill="none" stroke="#58768a" stroke-width="3"/>
    <path d="M 1293 398 C 1293 427, 1417 427, 1417 398" fill="none" stroke="#58768a" stroke-width="3"/>
    <path d="M 1293 410 C 1293 439, 1417 439, 1417 410" fill="none" stroke="#58768a" stroke-width="3"/>
    <text x="1355" y="453" text-anchor="middle" class="card-title">SQLite</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="760" y="645" width="350" height="154" rx="22" fill="url(#external)" stroke="#c58a32" stroke-width="3"/>
    <text x="935" y="700" text-anchor="middle" class="card-title">Alpha Vantage</text>
    <text x="935" y="733" text-anchor="middle" class="card-text">API externa de mercado</text>
    <text x="935" y="764" text-anchor="middle" class="small">TIME_SERIES_MONTHLY_ADJUSTED</text>
  </g>

  <path d="M 230 391 H 284" fill="none" stroke="#2f5f7b" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="255" y="365" text-anchor="middle" class="connection">HTTP</text>

  <path d="M 626 391 H 764" fill="none" stroke="#2f5f7b" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="695" y="355" text-anchor="middle" class="connection">REST / JSON</text>

  <path d="M 1106 391 H 1234" fill="none" stroke="#2f5f7b" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="1170" y="365" text-anchor="middle" class="connection">SQL</text>

  <path d="M 935 543 V 638" fill="none" stroke="#b27722" stroke-width="4" stroke-dasharray="10 9" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="965" y="594" class="connection">HTTPS</text>
  <text x="965" y="618" class="small">consulta de dados</text>

  <g transform="translate(80 650)">
    <rect width="580" height="155" rx="18" fill="#ffffff" stroke="#c8dce4" stroke-width="2"/>
    <text x="28" y="38" class="legend-title">Legenda</text>
    <rect x="30" y="59" width="22" height="22" rx="4" fill="url(#frontend)" stroke="#4f86b0"/>
    <text x="67" y="76" class="legend-text">Modulo desenvolvido no projeto</text>
    <rect x="30" y="98" width="22" height="22" rx="4" fill="url(#external)" stroke="#c58a32"/>
    <text x="67" y="115" class="legend-text">Servico externo consumido</text>
    <path d="M 290 70 H 355" stroke="#2f5f7b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="370" y="76" class="legend-text">Comunicacao obrigatoria</text>
    <path d="M 290 109 H 355" stroke="#b27722" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
    <text x="370" y="115" class="legend-text">Chamada a API externa</text>
  </g>
</svg>
